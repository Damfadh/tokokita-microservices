server {
    listen 80;
    server_name localhost;

    # Docker Compose menyediakan DNS internal di alamat ini. Penggunaan
    # variabel membuat Nginx dapat menyelesaikan nama service saat dibutuhkan.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /mahasiswa {
        set $mahasiswa_service mahasiswa-service:5000;
        proxy_pass http://$mahasiswa_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /matkul {
        set $matkul_service matkul-service:5000;
        proxy_pass http://$matkul_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
